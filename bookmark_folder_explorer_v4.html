<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Chrome-Style Bookmark Explorer</title>
<style>
:root{
  --bg:#fff;--text:#202124;--muted:#5f6368;--line:#e8eaed;
  --hover:#f1f3f4;--blue:#1a73e8;--folder:#fbbc04;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,Helvetica,sans-serif}
.app{max-width:1100px;margin:auto;padding:24px 24px 50px}
.top{position:sticky;top:0;background:rgba(255,255,255,.97);z-index:10;padding-bottom:14px}
h1{font-size:24px;margin:0 0 4px}
.sub{font-size:13px;color:var(--muted);margin-bottom:16px}
.controls{display:flex;gap:10px;align-items:center}
input[type=file]{max-width:310px}
input[type=search]{
  flex:1;min-width:180px;padding:10px 13px;border:1px solid #dadce0;
  border-radius:22px;font-size:14px;outline:none
}
input[type=search]:focus{border-color:var(--blue);box-shadow:0 0 0 1px var(--blue)}
button{
  border:1px solid #dadce0;background:#fff;border-radius:7px;padding:8px 12px;
  cursor:pointer;color:#3c4043;font-weight:600
}
button:hover{background:var(--hover)}
button.primary{background:var(--blue);border-color:var(--blue);color:white}
button.danger{color:#d93025}
button:disabled{opacity:.45;cursor:not-allowed}
.status{font-size:12px;color:var(--muted);padding:10px 2px}
.tree{font-size:14px}
.row{
  min-height:38px;display:flex;align-items:center;padding:3px 7px;
  border-radius:6px;user-select:none
}
.row:hover{background:var(--hover)}
.indent{flex:0 0 20px}
.twisty{
  width:22px;height:28px;border:0;padding:0;background:transparent;
  font-size:14px;color:#5f6368;display:flex;align-items:center;justify-content:center;
  cursor:pointer
}
.twisty:hover{background:#e8eaed}
.icon{width:22px;text-align:center;margin-right:7px;font-size:16px}
.name{
  flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis
}
.name.link{color:#1a73e8;text-decoration:none}
.name.link:hover{text-decoration:underline}
.folder-actions{display:flex;gap:5px;margin-left:8px}
.openall{
  font-size:11px;padding:5px 8px;color:#1a73e8;
  border-color:#d2e3fc;background:#fff;white-space:nowrap
}
.children{display:block}
.collapsed{display:none}
.match{
  background:#fff3cd;border-radius:2px;padding:1px 2px
}
.path{
  font-size:11px;color:#80868b;margin-left:44px;margin-top:-1px;margin-bottom:2px
}
.empty{padding:35px;text-align:center;color:var(--muted)}
.batch{
  margin:12px 0;padding:10px 13px;border:1px solid #f0d77a;
  background:#fff8e1;border-radius:8px;font-size:12px;color:#5f4b00;display:none
}
@media(max-width:700px){
 .controls{flex-wrap:wrap}
 input[type=search]{flex-basis:100%;order:3}
}
</style>
</head>
<body>
<div class="app">
  <div class="top">
    <h1>Bookmark Explorer</h1>
    <div class="sub">Chrome-style viewer for Netscape/Chrome exported bookmark HTML files</div>
    <div class="controls">
      <input id="file" type="file" accept=".html,.htm,text/html">
      <input id="search" type="search" placeholder="Search bookmarks and folders…" disabled>
      <button id="collapse" disabled>Collapse all</button>
      <button id="expand" disabled>Expand all</button>
    </div>
    <div id="status" class="status">Upload your bookmarks HTML file.</div>
  </div>

  <div id="batch" class="batch">
    <strong>Batch opened.</strong>
    Browser popup rules may limit how many tabs can be opened automatically.
    <button id="closeBatch" class="danger">Close batch window</button>
  </div>

  <div id="tree" class="tree"></div>
</div>

<script>
(() => {
  const $ = id => document.getElementById(id);
  const fileEl=$('file'), searchEl=$('search'), treeEl=$('tree');
  const statusEl=$('status'), collapseEl=$('collapse'), expandEl=$('expand');
  const batchEl=$('batch'), closeBatchEl=$('closeBatch');

  let root=null;
  let uid=0;
  let batchWindow=null;

  /*
   * Important parser detail:
   * Netscape bookmark HTML is not necessarily valid modern HTML.
   * We therefore parse DT/DL relationships explicitly rather than relying
   * on a simplistic "folder -> next DL" assumption.
   */
  function parseBookmarks(text){
    const doc=new DOMParser().parseFromString(text,'text/html');
    const firstDL=doc.querySelector('dl');
    if(!firstDL) throw new Error('No bookmark <DL> structure was found.');

    // The HTML parser nests a folder's <DL> INSIDE its <DT> (DT is never
    // implicitly closed by DL). Explicit </DT> exports make it a sibling
    // instead, so both layouts are handled.
    function findChildDL(dt){
      for(const c of dt.children) if(c.tagName==='DL') return c;
      let n=dt.nextElementSibling;
      while(n && n.tagName!=='DT'){
        if(n.tagName==='DL') return n;
        n=n.nextElementSibling;
      }
      return null;
    }

    function parseDL(dl){
      const nodes=[];
      for(const el of dl.children){
        if(el.tagName!=='DT') continue;
        const h3=Array.from(el.children).find(x=>x.tagName==='H3');
        const a=Array.from(el.children).find(x=>x.tagName==='A');
        if(h3){
          const childDL=findChildDL(el);
          nodes.push({
            id:++uid,type:'folder',
            name:(h3.textContent||'').trim(),
            children:childDL?parseDL(childDL):[],
            open:false
          });
        }else if(a){
          const url=a.getAttribute('href')||'';
          nodes.push({
            id:++uid,type:'bookmark',
            name:(a.textContent||'').trim()||url,
            url,
            icon:a.getAttribute('icon')||''
          });
        }
      }
      return nodes;
    }

    return {id:++uid,type:'folder',name:'Bookmarks',children:parseDL(firstDL),open:true};
  }

  function walk(node,fn){
    fn(node);
    if(node.type==='folder') node.children.forEach(c=>walk(c,fn));
  }
  function allFolders(){
    const a=[];walk(root,n=>{if(n.type==='folder')a.push(n)});return a;
  }
  function directBookmarks(folder){
    return folder.children.filter(x=>x.type==='bookmark');
  }

  function escapeHTML(s){
    return String(s).replace(/[&<>"']/g,c=>({
      '&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'
    }[c]));
  }

  /* ---------- search ----------
   * Terms are split on whitespace and ALL must appear (in title or URL,
   * like Chrome). Every node at every depth is tested.
   *   matches : nodes that match themselves
   *   sub     : nodes that match OR contain a match (kept visible)
   *   desc    : folders that contain a match below them (auto-opened)
   * Search never hides a folder's children once the folder is opened.
   */
  let terms=[], matches=new Set(), sub=new Set(), desc=new Set();
  let override=new Map();   // search mode: id -> user-chosen open state
  let termRe=null;

  function runSearch(q){
    terms=q.toLocaleLowerCase().split(/\s+/).filter(Boolean);
    matches=new Set();sub=new Set();desc=new Set();
    termRe=terms.length
      ? new RegExp('('+terms.slice().sort((a,b)=>b.length-a.length)
          .map(t=>t.replace(/[.*+?^${}()|[\]\\]/g,'\\$&')).join('|')+')','gi')
      : null;
    if(!terms.length) return;

    const hit=n=>{
      const hay=(n.name+' '+(n.type==='bookmark'?n.url:'')).toLocaleLowerCase();
      return terms.every(t=>hay.includes(t));
    };
    (function mark(n){
      let below=false;
      if(n.type==='folder'){
        for(const c of n.children) if(mark(c)) below=true;
      }
      const self=n!==root && hit(n);
      if(self) matches.add(n.id);
      if(below) desc.add(n.id);
      if(self||below) sub.add(n.id);
      return self||below;
    })(root);
  }

  function highlight(text){
    if(!termRe) return escapeHTML(text);
    return text.split(termRe).map((part,i)=>
      i%2 ? '<span class="match">'+escapeHTML(part)+'</span>' : escapeHTML(part)
    ).join('');
  }

  function favicon(url,stored){
    if(stored) return stored;
    try{
      const u=new URL(url);
      if(!/^https?:$/.test(u.protocol)) return '';
      return 'https://www.google.com/s2/favicons?domain='+encodeURIComponent(u.hostname)+'&sz=32';
    }catch{return ''}
  }

  /* ---------- rendering ---------- */
  function render(){
    treeEl.innerHTML='';
    if(!root) return;

    const q=searchEl.value.trim();
    runSearch(q);
    const searching=terms.length>0;

    if(searching && !matches.size){
      treeEl.innerHTML='<div class="empty">No bookmarks or folders match “'+escapeHTML(q)+'”.</div>';
      statusEl.textContent='0 matches';
      return;
    }

    const top=searching ? root.children.filter(c=>sub.has(c.id)) : root.children;
    top.forEach(n=>renderNode(n,treeEl,0,searching));

    if(searching){
      let f=0,b=0;
      walk(root,n=>{if(matches.has(n.id)) n.type==='folder'?f++:b++});
      statusEl.textContent=b+' bookmark'+(b===1?'':'s')+' and '+f+' folder'+(f===1?'':'s')+
        ' match. Click any folder to open/close it and see all its contents.';
    }else{
      statusEl.textContent='Showing all bookmarks. Click a folder to expand/collapse it.';
    }
  }

  function renderNode(node,parent,level,searching){
    const wrap=document.createElement('div');
    const row=document.createElement('div');
    row.className='row';
    for(let i=0;i<level;i++){
      const s=document.createElement('span');s.className='indent';row.appendChild(s);
    }

    if(node.type==='folder'){
      const isOpen=searching
        ? (override.has(node.id)?override.get(node.id):desc.has(node.id))
        : node.open;
      // When searching, a folder that matches itself or was opened by hand
      // shows ALL its children; otherwise only branches leading to matches.
      const showAll=!searching || matches.has(node.id) || override.get(node.id)===true;

      const toggle=()=>{
        if(searching) override.set(node.id,!isOpen); else node.open=!node.open;
        render();
      };

      const twist=document.createElement('button');
      twist.className='twisty';
      twist.textContent=isOpen?'▾':'▸';
      twist.title=isOpen?'Collapse folder':'Expand folder';
      twist.onclick=e=>{e.stopPropagation();toggle()};

      const icon=document.createElement('span');
      icon.className='icon';icon.textContent='📁';

      const name=document.createElement('span');
      name.className='name';
      name.style.cursor='pointer';
      name.innerHTML=highlight(node.name);
      name.onclick=toggle;

      const actions=document.createElement('span');
      actions.className='folder-actions';
      const open=document.createElement('button');
      open.className='openall';
      const count=directBookmarks(node).length;
      open.textContent='Open all'+(count?' ('+count+')':'');
      open.title='Open all direct bookmarks in this folder';
      open.disabled=!count;
      open.onclick=e=>{e.stopPropagation();openAll(node)};
      actions.appendChild(open);

      row.append(twist,icon,name,actions);
      wrap.appendChild(row);

      if(isOpen){
        const kids=showAll?node.children:node.children.filter(c=>sub.has(c.id));
        const box=document.createElement('div');
        box.className='children';
        if(!kids.length){
          const e=document.createElement('div');
          e.className='row';
          for(let i=0;i<=level+1;i++){
            const s=document.createElement('span');s.className='indent';e.appendChild(s);
          }
          e.style.color='#80868b';e.style.fontSize='12px';e.textContent='(empty)';
          box.appendChild(e);
        }
        kids.forEach(c=>renderNode(c,box,level+1,searching));
        wrap.appendChild(box);
      }
    }else{
      const spacer=document.createElement('span');
      spacer.className='twisty';spacer.style.cursor='default';

      const icon=document.createElement('img');
      icon.className='icon';
      icon.style.width='22px';icon.style.height='18px';icon.style.objectFit='contain';
      icon.alt='';
      const fav=favicon(node.url,node.icon);
      if(fav) icon.src=fav; else icon.style.visibility='hidden';
      icon.onerror=()=>{icon.style.visibility='hidden'};

      const a=document.createElement('a');
      a.className='name link';
      a.style.flex='0 1 auto';
      a.target='_blank';a.rel='noopener noreferrer';
      if(!/^\s*javascript:/i.test(node.url)) a.href=node.url;
      a.title=node.url;
      a.innerHTML=highlight(node.name);

      row.append(spacer,icon,a);
      if(searching){
        const u=document.createElement('span');
        u.className='name';
        u.style.cssText='flex:1 1 0;margin-left:12px;font-size:12px;color:#80868b';
        u.innerHTML=highlight(node.url);
        row.appendChild(u);
      }
      wrap.appendChild(row);
    }
    parent.appendChild(wrap);
  }

  function setAll(open){
    if(searchEl.value.trim()){
      override=new Map();
      allFolders().forEach(f=>override.set(f.id,open));
    }else{
      allFolders().forEach(f=>f.open=open);
    }
    render();
  }

  /*
   * Open-all strategy:
   * The browser controls popup policy. A single user gesture is used to
   * create one named batch window first. We then request the other URLs.
   * If the browser blocks popup creation, a dedicated batch page is used
   * as a fallback rather than pretending that dozens of windows can always
   * be opened.
   */
  // Inside the companion extension, chrome.windows.create opens ONE new
  // window holding every link as a tab - close that window, all tabs close.
  const hasExt = typeof chrome!=='undefined' && chrome.windows && chrome.windows.create;

  function openAll(folder){
    const all=directBookmarks(folder).map(x=>x.url);
    if(!all.length)return;

    if(hasExt){
      const urls=all.filter(u=>/^https?:\/\//i.test(u));
      if(!urls.length){alert('No http(s) links in this folder.');return;}
      chrome.windows.create({url:urls,focused:true});
      if(urls.length<all.length)
        statusEl.textContent='Opened '+urls.length+' tabs in a new window ('+(all.length-urls.length)+' non-web links skipped).';
      else
        statusEl.textContent='Opened '+urls.length+' tabs in a new window: "'+folder.name+'".';
      return;
    }
    openAllFallback(folder,all);
  }

  function openAllFallback(folder,urls){

    let w=null;
    try{
      w=window.open('about:blank','bookmark_batch_window',
        'popup=yes,width=1200,height=800,resizable=yes,scrollbars=yes');
    }catch(_){}

    if(!w || w.closed){
      showBatchFallback(folder,urls);
      return;
    }

    batchWindow=w;
    batchEl.style.display='block';

    try{
      w.document.open();
      w.document.write(`
        <!doctype html><html><head><title>${escapeHTML(folder.name)} — Bookmark Batch</title>
        <style>body{font-family:Arial;padding:24px}h2{margin-top:0}
        a{display:block;margin:8px 0;color:#1a73e8}</style></head>
        <body><h2>${escapeHTML(folder.name)}</h2>
        <p>This window contains the bookmark batch. If your browser permits popup
        tabs, the remaining links are being opened now.</p>
        <div id="links"></div></body></html>`);
      w.document.close();

      const links=w.document.getElementById('links');
      urls.forEach((url,i)=>{
        const a=w.document.createElement('a');
        a.href=url;a.target='_blank';a.rel='noopener noreferrer';
        a.textContent=(i+1)+'. '+url;
        links.appendChild(a);
      });

      // Attempt individual tabs. Chrome may allow these because they originate
      // from the same click, but this is intentionally treated as best-effort.
      for(let i=0;i<urls.length;i++){
        try{window.open(urls[i],'bookmark_tab_'+Date.now()+'_'+i)}catch(_){}
      }
    }catch(_){}
  }

  function showBatchFallback(folder,urls){
    const w=window.open('about:blank','bookmark_batch_fallback',
      'popup=yes,width=1000,height=800');
    if(!w){
      alert('Chrome blocked the popup. Please allow popups for this local HTML file and click Open all again.');
      return;
    }
    batchWindow=w;
    batchEl.style.display='block';

    w.document.open();
    w.document.write(`
      <!doctype html><html><head><title>Bookmark Batch</title>
      <style>body{font-family:Arial;padding:24px}a{display:block;padding:7px 0}</style>
      </head><body><h2>${escapeHTML(folder.name)}</h2>
      <p>Chrome blocked automatic multi-tab opening. Click the links below.
      This page can be closed as one batch.</p>
      ${urls.map((u,i)=>'<a target="_blank" rel="noopener noreferrer" href="'+escapeHTML(u)+'">'+
        (i+1)+'. '+escapeHTML(u)+'</a>').join('')}
      </body></html>`);
    w.document.close();
  }

  closeBatchEl.onclick=()=>{
    if(batchWindow && !batchWindow.closed)batchWindow.close();
    batchWindow=null;
    batchEl.style.display='none';
  };

  fileEl.onchange=async()=>{
    const file=fileEl.files[0];
    if(!file)return;
    try{
      uid=0;
      root=parseBookmarks(await file.text());
      searchEl.disabled=false;
      collapseEl.disabled=false;
      expandEl.disabled=false;
      searchEl.value='';
      override=new Map();
      root.children.forEach(c=>{if(c.type==='folder')c.open=true});
      render();
      statusEl.textContent='Loaded '+file.name+' — '+countNodes(root)+' bookmarks/folders.';
    }catch(e){
      root=null;treeEl.innerHTML='';
      searchEl.disabled=true;collapseEl.disabled=true;expandEl.disabled=true;
      statusEl.textContent='Error: '+e.message;
    }
  };

  function countNodes(n){
    let c=0;walk(n,x=>{if(x!==n)c++});return c;
  }

  searchEl.oninput=()=>{override=new Map();render()};
  collapseEl.onclick=()=>setAll(false);
  expandEl.onclick=()=>setAll(true);

})();
</script>
</body>
</html>
